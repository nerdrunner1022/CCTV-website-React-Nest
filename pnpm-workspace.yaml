packages:
  - "apps/*"
  - "packages/*"

# Packages whose install/build scripts may run (pnpm blocks these by default).
allowBuilds:
  argon2: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  "@tailwindcss/oxide": true
  "@nestjs/core": true
  unrs-resolver: true
  # Local dev Postgres: marks the bundled binaries executable.
  "@embedded-postgres/linux-x64": true
